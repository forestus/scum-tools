# Aviso de patch do SCUM: todo dia confere as notícias do jogo na Steam.
# Quando sai patch novo, abre uma issue aqui no repositório (o GitHub manda e-mail para o dono).
name: Aviso de patch do SCUM

on:
  schedule:
    - cron: '17 12 * * *'   # todo dia às 09:17 (horário de Brasília)
  workflow_dispatch:        # botão "Run workflow" para testar na hora

permissions:
  issues: write
  contents: read

jobs:
  conferir:
    runs-on: ubuntu-latest
    steps:
      - name: Procura patch novo do SCUM na Steam
        uses: actions/github-script@v7
        with:
          script: |
            const APP = 513710; // SCUM
            const url = `https://api.steampowered.com/ISteamNews/GetNewsForApp/v2/?appid=${APP}&count=20&feeds=steam_community_announcements`;
            const res = await fetch(url);
            if (!res.ok) { core.warning(`Steam respondeu ${res.status}; tento de novo amanhã.`); return; }
            const items = ((await res.json()).appnews || {}).newsitems || [];
            // só notas de atualização do jogo (não eventos, promoções etc.)
            const patches = items.filter(n => (n.tags || []).includes('patchnotes') || /\b(patch|hotfix|update)\b/i.test(n.title));
            if (!patches.length) { core.info('Nenhuma nota de patch nas notícias recentes.'); return; }

            const { owner, repo } = context.repo, label = 'patch-scum';
            try { await github.rest.issues.getLabel({ owner, repo, name: label }); }
            catch (e) { await github.rest.issues.createLabel({ owner, repo, name: label, color: 'c9ab73', description: 'Saiu patch do SCUM: testar o Hack do Bunker' }); }

            const old = await github.paginate(github.rest.issues.listForRepo, { owner, repo, labels: label, state: 'all', per_page: 100 });
            const seen = new Set(old.map(i => ((i.body || '').match(/steam-gid:(\d+)/) || [])[1]).filter(Boolean));
            // só o que é mais novo que o último patch já avisado
            const cutoff = Math.max(0, ...patches.filter(p => seen.has(String(p.gid))).map(p => p.date));
            let fresh = patches.filter(p => !seen.has(String(p.gid)) && p.date > cutoff);
            if (!old.length) fresh = fresh.slice(0, 1); // primeira vez: só o mais recente, sem enxurrada
            if (!fresh.length) { core.info('Nenhum patch novo desde o último aviso.'); return; }

            for (const p of fresh.slice(0, 3).reverse()) {
              const day = new Date(p.date * 1000).toISOString().slice(0, 10);
              await github.rest.issues.create({
                owner, repo, labels: [label],
                title: `Patch do SCUM: ${p.title}`,
                body: [
                  `Saiu atualização do SCUM em **${day}**.`,
                  '',
                  `Notas do patch na Steam: ${p.url}`,
                  '',
                  '**Conferir o Hack do Bunker:**',
                  '- [ ] Abrir https://forestus.github.io/scum-tools/ e colar um print do painel depois do patch',
                  '- [ ] Ver se os números lidos e a resposta batem com o jogo',
                  '- [ ] Se estiver tudo certo: trocar a data do selo (`data-date="..."` no `index.html`) e fechar esta issue',
                  '',
                  `<!-- steam-gid:${p.gid} -->`
                ].join('\n')
              });
              core.info(`Aviso aberto: ${p.title}`);
            }
